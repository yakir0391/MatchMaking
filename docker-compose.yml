version: '3.9'

services:

  matchmaking-service:
    build:
      context: ./
      dockerfile: MatchmakingService/MatchmakingService/Dockerfile
    container_name: matchmaking-service
    environment:
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: "guest"
      RabbitMQ__Password: "guest"
    ports:
      - "5000:8080"

  game-session-service:
    build:
      context: ./
      dockerfile: GameSessionService/Dockerfile
    container_name: game-session-service
    environment:
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: "guest"
      RabbitMQ__Password: "guest"
      ConnectionStrings__GameSessionDatabase: "Host=postgres;Port=5432;Database=matchmaking;Username=postgres;Password=postgres"
    ports:
      - "5001:8080"
    depends_on:
      - postgres 
      - rabbitmq

  redis:
    image: redis:7
    container_name: matchmaking-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: matchmaking-rabbitmq
    ports:
    - "5672:5672"
    - "15672:15672"

  postgres:
    image: postgres:16
    container_name: matchmaking-postgres
    environment:
      POSTGRES_DB: matchmaking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: